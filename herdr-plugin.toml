id = "quintindk.herdr-relay"
name = "Herdr Relay"
version = "0.1.0-dev.0"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]
description = "Connect Paperclip work to persistent agents in herdr."

[[actions]]
id = "toggle"
title = "Toggle Relay task hierarchy"
contexts = ["pane"]
command = ["python3", "scripts/toggle-board.py"]

[[actions]]
id = "status"
title = "Relay: service status"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "status"]

[[actions]]
id = "work"
title = "Relay: task hierarchy by owner"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "board"]

[[actions]]
id = "agents"
title = "Relay: discover agents"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "agent", "discover"]

[[panes]]
id = "work"
title = "Relay tasks"
placement = "split"
command = ["bash", "scripts/plugin-launch.sh", "board", "--watch"]

[[actions]]
id = "observed"
title = "Relay: Herdr agent registrations"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "agent", "observed"]
