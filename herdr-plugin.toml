id = "quintindk.herdr-relay"
name = "Herdr Relay"
version = "0.2.1"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]
description = "Native tasks, agent messaging and durable node services for Herdr."

[[actions]]
id = "toggle"
title = "Toggle Relay TUI"
contexts = ["pane"]
command = ["python3", "scripts/toggle-board.py"]

[[actions]]
id = "status"
title = "Relay: node health"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "doctor"]

[[actions]]
id = "native-work"
title = "Relay: native task board"
contexts = ["global"]
command = ["node", "scripts/native-board-launch.mjs", "--json"]

[[panes]]
id = "native-work"
title = "Relay"
placement = "split"
command = ["node", "scripts/native-board-launch.mjs"]

[[panes]]
id = "native-agent"
title = "Relay agent: new receiving chat"
placement = "split"
command = ["node", "scripts/native-agent-launch.mjs"]
