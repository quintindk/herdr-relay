id = "synthswarm.herdr-relay"
name = "Herdr Relay"
version = "0.1.0-dev.0"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]
description = "Connect Paperclip work to persistent agents in herdr."

[[actions]]
id = "status"
title = "Relay: service status"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "status"]

[[actions]]
id = "work"
title = "Relay: work and agent overview"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "view"]

[[actions]]
id = "agents"
title = "Relay: discover agents"
contexts = ["global"]
command = ["bash", "scripts/plugin-launch.sh", "agent", "discover"]

[[panes]]
id = "work"
title = "Relay work"
placement = "split"
command = ["bash", "scripts/plugin-launch.sh", "view", "--watch"]
