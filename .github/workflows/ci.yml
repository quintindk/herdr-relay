name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Node 24 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_AUTHOR_NAME: Relay CI
      GIT_AUTHOR_EMAIL: relay-ci@example.invalid
      GIT_COMMITTER_NAME: Relay CI
      GIT_COMMITTER_EMAIL: relay-ci@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/opencode-relay/package-lock.json
      - name: Prepare isolated test scratch directory
        run: mkdir -p /tmp/opencode
      - name: Validate GitHub workflow syntax and shell steps
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/opencode-relay --no-audit --no-fund
      - run: npm run check
      - name: Root regression tests (serial)
        run: node --test --test-concurrency=1 test/*.test.mjs
      - run: npm run test:v2

  package:
    name: Verify installed release package
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare scratch directory
        run: mkdir -p /tmp/opencode
      - name: Verify version metadata and release notes
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release.mjs
      - name: Clean installation, onboarding and fresh production audit
        run: node scripts/verify-package.mjs --release --output "$RUNNER_TEMP/release"
      - name: Stage release notes
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          cp "docs/release-$VERSION.md" "$RUNNER_TEMP/release/RELEASE-NOTES.md"
      - name: Retain downloadable package and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
